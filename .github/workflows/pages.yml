name: Déploiement GitHub Pages (Frankinator)

# Build statique de Frankinator publié sur GitHub Pages.
# La route serveur /api/correct est retirée (impossible en statique) :
# la correction IA passe en mode navigateur (clé utilisateur, localStorage).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build statique
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          # URL du proxy Cloudflare Worker de correction (variable de dépôt,
          # ou valeur par défaut ci-dessous une fois le worker déployé).
          CORRECT_ENDPOINT: ${{ vars.CORRECT_ENDPOINT }}
        run: |
          # Les routes API ne peuvent pas exister dans un export statique.
          rm -rf src/app/api
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
